# SPDX-License-Identifier: AGPL-3.0-or-later
name: CI

on:
  push:
    branches: [main]
  pull_request:
  # El workflow de release reutiliza este: publica exactamente lo que aquí se
  # ha compilado, validado y empaquetado.
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # dsp/ y core/ compilados y testeados SIN JUCE: garantiza que no dependen
  # del framework (docs/arquitectura.md). Incluye esceq_bench (tools/bench),
  # que solo usa dsp/, con su prueba de humo.
  core:
    name: dsp + core (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5
      - name: Configurar
        run: cmake -S . -B build -DESCEQ_BUILD_PLUGIN=OFF -DESCEQ_BUILD_TOOLS=ON -DCMAKE_BUILD_TYPE=Debug
      - name: Compilar
        run: cmake --build build --config Debug --parallel 4
      - name: Tests
        run: ctest --test-dir build -C Debug --output-on-failure

  # RealtimeSanitizer: todos los tests de dsp/, core/ y ui/logic, y aborta si
  # una función del hilo de audio (ESCEQ_NONBLOCKING) asigna memoria o bloquea.
  rtsan:
    name: RealtimeSanitizer
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CC: clang-20
      CXX: clang++-20
    steps:
      - uses: actions/checkout@v5
      - name: Clang 20
        timeout-minutes: 10
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo rm -f /var/lib/man-db/auto-update
          APT="sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o DPkg::Lock::Timeout=120"
          $APT update
          $APT install -y --no-install-recommends clang-20 libclang-rt-20-dev llvm-20
      - name: Configurar
        run: cmake -S . -B build -DESCEQ_BUILD_PLUGIN=OFF -DESCEQ_RTSAN=ON -DCMAKE_BUILD_TYPE=RelWithDebInfo
      - name: Compilar
        run: cmake --build build --parallel 4
      - name: Tests
        env:
          RTSAN_OPTIONS: external_symbolizer_path=/usr/lib/llvm-20/bin/llvm-symbolizer
        run: ctest --test-dir build --output-on-failure

  # AddressSanitizer y UndefinedBehaviorSanitizer: todos los tests, incluidos
  # los de la capa del plugin (processBlock, estado, deshacer, presets), que
  # usan JUCE. Detecta accesos a memoria ya liberada o fuera de ámbito.
  sanitizers:
    name: ASan + UBSan
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - name: Dependencias
        timeout-minutes: 10
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo rm -f /var/lib/man-db/auto-update
          APT="sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o DPkg::Lock::Timeout=120"
          $APT update
          $APT install -y --no-install-recommends \
            libasound2-dev libx11-dev libxext-dev libxrandr-dev libxinerama-dev \
            libxcursor-dev libxi-dev libfreetype-dev libfontconfig1-dev libgl1-mesa-dev
      - name: Configurar
        run: >
          cmake -S . -B build -DCMAKE_BUILD_TYPE=RelWithDebInfo -DESCEQ_BUILD_CLAP=OFF
          "-DCMAKE_CXX_FLAGS=-fsanitize=address,undefined -fno-sanitize-recover=undefined -fno-omit-frame-pointer"
          "-DCMAKE_EXE_LINKER_FLAGS=-fsanitize=address,undefined"
      # Solo los tests: el plugin en sí no hace falta y su enlazado con LTO es lento.
      - name: Compilar
        run: cmake --build build --parallel 4 --target esceq_tests esceq_plugin_tests
      - name: Tests
        env:
          # Las fugas no se comprueban: JUCE deja vivos a propósito algunos
          # objetos globales hasta el final y darían falsos avisos.
          ASAN_OPTIONS: detect_leaks=0:detect_stack_use_after_return=1
          UBSAN_OPTIONS: print_stacktrace=1
        run: ctest --test-dir build --output-on-failure

  # Plugin completo: compila, pasa los tests, valida cada formato con su
  # validador y empaqueta lo que se publicará en una release.
  #
  # Linux se compila en un contenedor de Ubuntu 22.04 (glibc 2.35, GCC 11):
  # lo que se compila en un sistema carga en ese y en los posteriores, no en
  # los anteriores. Así carga también en Debian 12 y en Fedora 36 o
  # posteriores (ADR 0022).
  plugin:
    name: plugin (${{ matrix.os }}${{ matrix.container && format(', {0}', matrix.container) || '' }})
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            container: ubuntu:22.04
            # En Linux, pluginval se compila con un arreglo (paso siguiente).
            pluginval: ""
            pluginval_bin: ./pluginval-linux/pluginval
            clap_validator: clap-validator-0.3.2-ubuntu-18.04.tar.gz
            cmake_args: ""
          - os: windows-latest
            pluginval: pluginval_Windows.zip
            pluginval_bin: ./pluginval.exe
            clap_validator: clap-validator-0.3.2-windows.zip
            cmake_args: ""
          - os: macos-latest
            pluginval: pluginval_macOS.zip
            pluginval_bin: ./pluginval.app/Contents/MacOS/pluginval
            clap_validator: clap-validator-0.3.2-macos-universal.tar.gz
            # Binario universal: Apple Silicon e Intel.
            cmake_args: -DCMAKE_OSX_ARCHITECTURES=arm64;x86_64
    env:
      ARTEFACTS: build/plugin/esceQ_artefacts/Release
    steps:
      # Antes del checkout: así lo hace con git, que el contenedor no trae.
      - name: Dependencias (Linux)
        if: runner.os == 'Linux'
        timeout-minutes: 10
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          APT="apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o DPkg::Lock::Timeout=120"
          $APT update
          $APT install -y --no-install-recommends \
            build-essential git ca-certificates curl unzip python3-pip binutils \
            libasound2-dev libx11-dev libxext-dev libxrandr-dev libxinerama-dev \
            libxcursor-dev libxi-dev libfreetype-dev libfontconfig1-dev libgl1-mesa-dev \
            xvfb xauth gdb ladspa-sdk
          # La de Ubuntu 22.04 es la 3.22, y el proyecto pide la 3.24.
          pip3 install --no-cache-dir "cmake==3.31.6"
          # El compilador del sistema, GCC 11: con otro, ar no entiende los
          # objetos de LTO. Lo usan también las herramientas de JUCE.
          echo "CC=gcc" >> "$GITHUB_ENV"
          echo "CXX=g++" >> "$GITHUB_ENV"

      - uses: actions/checkout@v5

      - name: Version
        id: version
        shell: bash
        run: |
          VERSION=$(sed -n 's/^project(esceQ VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)
          test -n "$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Version $VERSION"

      - name: Configurar
        shell: bash
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release "${{ matrix.cmake_args }}"

      - name: Compilar
        run: cmake --build build --config Release --parallel 4

      - name: Tests
        run: ctest --test-dir build -C Release --output-on-failure

      # Que carga en las distribuciones que se soportan: versiones de glibc y
      # de libstdc++, y bibliotecas con las que enlaza.
      - name: Compatibilidad del binario (Linux)
        if: runner.os == 'Linux'
        run: >
          packaging/unix/check-linux-binary.sh
          "$ARTEFACTS/VST3/esceQ.vst3/Contents/x86_64-linux/esceQ.so"
          "$ARTEFACTS/CLAP/esceQ.clap"

      # Sin la generación de Xcode, el enlazador firma ad hoc el binario arm64
      # pero no el paquete: se firma entero (ad hoc, sin certificado) antes de
      # validarlo, y se comprueba cada formato: las dos arquitecturas, macOS
      # 11 como mínimo en las dos y la firma (ADR 0022).
      - name: Firma ad hoc y arquitecturas (macOS)
        if: runner.os == 'macOS'
        run: |
          for bundle in "$ARTEFACTS/VST3/esceQ.vst3" "$ARTEFACTS/AU/esceQ.component" "$ARTEFACTS/CLAP/esceQ.clap"; do
            executable=$(/usr/libexec/PlistBuddy -c "Print :CFBundleExecutable" "$bundle/Contents/Info.plist")
            binary="$bundle/Contents/MacOS/$executable"
            archs=$(lipo -archs "$binary")
            echo "$bundle: $archs"
            for arch in arm64 x86_64; do
              case " $archs " in *" $arch "*) ;; *) echo "::error::$binary no tiene $arch"; exit 1 ;; esac
              minos=$(vtool -arch "$arch" -show-build "$binary" | awk '$1 == "minos" { print $2 }')
              echo "  $arch: macOS $minos como mínimo"
              if [ "$minos" != "11.0" ]; then echo "::error::$binary ($arch) pide macOS $minos"; exit 1; fi
            done
            codesign --force --sign - "$bundle"
            codesign --verify --strict --verbose=2 "$bundle"
          done

      # pluginval 1.0.4 publicado lleva JUCE 8.0.3, cuyo host VST3 de Linux
      # puede usar memoria liberada al destruir una instancia y caerse al
      # terminar una prueba (ADR 0021). En Linux se compila con el arreglo de
      # JUCE 9.0.2; se guarda en la cache hasta que cambie el script o el parche.
      - name: Cache de pluginval (Linux)
        if: runner.os == 'Linux'
        id: pluginval-cache
        uses: actions/cache@v4
        with:
          path: pluginval-linux
          key: pluginval-1.0.4-${{ matrix.os }}-${{ matrix.container }}-${{ hashFiles('tools/pluginval/**') }}

      - name: Compilar pluginval (Linux)
        if: runner.os == 'Linux' && steps.pluginval-cache.outputs.cache-hit != 'true'
        run: tools/pluginval/build.sh pluginval-linux

      - name: Descargar validadores
        shell: bash
        run: |
          # pluginval, fijado por version: una version nueva no debe poder
          # tumbar una release el dia de la etiqueta.
          if [ -n "${{ matrix.pluginval }}" ]; then
            curl -sSfL --retry 3 -o pluginval.zip \
              "https://github.com/Tracktion/pluginval/releases/download/v1.0.4/${{ matrix.pluginval }}"
            unzip -q pluginval.zip
          fi
          # clap-validator, fijado por version.
          mkdir clap-validator-dir
          curl -sSfL --retry 3 -o "${{ matrix.clap_validator }}" \
            "https://github.com/free-audio/clap-validator/releases/download/0.3.2/${{ matrix.clap_validator }}"
          case "${{ matrix.clap_validator }}" in
            *.zip) unzip -q "${{ matrix.clap_validator }}" -d clap-validator-dir ;;
            *) tar xzf "${{ matrix.clap_validator }}" -C clap-validator-dir ;;
          esac
          ls clap-validator-dir

      - name: pluginval (VST3, nivel 10)
        shell: bash
        run: |
          VST3="$ARTEFACTS/VST3/esceQ.vst3"
          if [ "$RUNNER_OS" = "Linux" ]; then
            # Bajo gdb: si pluginval se cae, el registro trae la pila de todos
            # los hilos. El código de salida es el de pluginval, o 139 si una
            # señal lo detiene.
            cat > crash.gdb <<'GDB'
          set pagination off
          set disable-randomization off
          run
          if $_isvoid($_exitcode)
            thread apply all bt
            quit 139
          end
          quit $_exitcode
          GDB
            xvfb-run -a gdb -q -batch -x crash.gdb --args \
              ${{ matrix.pluginval_bin }} --strictness-level 10 --validate "$VST3"
          else
            ${{ matrix.pluginval_bin }} --strictness-level 10 --validate "$VST3"
          fi

      - name: clap-validator (CLAP)
        shell: bash
        run: |
          CLAP="$ARTEFACTS/CLAP/esceQ.clap"
          VALIDATOR=$(find clap-validator-dir -type f -name 'clap-validator*' | head -1)
          chmod +x "$VALIDATOR"
          # --only-failed: el informe completo es largo; interesa lo que falle.
          if [ "$RUNNER_OS" = "Linux" ]; then
            xvfb-run -a "$VALIDATOR" validate --only-failed "$CLAP"
          else
            "$VALIDATOR" validate --only-failed "$CLAP"
          fi

      - name: auval (AU)
        if: runner.os == 'macOS'
        run: |
          mkdir -p ~/Library/Audio/Plug-Ins/Components
          cp -R "$ARTEFACTS/AU/esceQ.component" ~/Library/Audio/Plug-Ins/Components/
          # El registro de componentes guarda una cache: se reinicia para que vea el nuevo.
          killall -9 AudioComponentRegistrar 2>/dev/null || true
          # Tipo, subtipo y fabricante: kAudioUnitType_Effect, PLUGIN_CODE y
          # PLUGIN_MANUFACTURER_CODE de plugin/CMakeLists.txt.
          auval -strict -v aufx EscQ Escq

      # Sin el redistribuible de Visual C++ el plugin no cargaria: debe llevar
      # la biblioteca de ejecucion enlazada dentro (CMAKE_MSVC_RUNTIME_LIBRARY).
      - name: Sin dependencias del redistribuible de Visual C++ (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $dumpbin = & $vswhere -latest -products * -find "VC\Tools\MSVC\**\bin\Hostx64\x64\dumpbin.exe" | Select-Object -First 1
          if (-not $dumpbin) { throw "No se encuentra dumpbin" }
          foreach ($binary in @("$env:ARTEFACTS\VST3\esceQ.vst3\Contents\x86_64-win\esceQ.vst3", "$env:ARTEFACTS\CLAP\esceQ.clap")) {
            $imports = & $dumpbin /dependents $binary | Out-String
            Write-Output $imports
            if ($imports -match '(?i)(vcruntime|msvcp|concrt)\d+') { throw "$binary depende del redistribuible de Visual C++" }
          }

      # --- Paquetes: lo que se publica en una release -------------------------

      - name: Paquete (Linux)
        if: runner.os == 'Linux'
        run: |
          NAME="esceQ-${{ steps.version.outputs.version }}-linux-x64"
          mkdir -p "dist/$NAME"
          cp -r "$ARTEFACTS/VST3/esceQ.vst3" "$ARTEFACTS/CLAP/esceQ.clap" "dist/$NAME/"
          cp LICENSE "dist/$NAME/LICENSE.txt"
          cp ui/assets/fonts/OFL.txt "dist/$NAME/Inter-font-license.txt"
          cp packaging/unix/INSTALL.txt "dist/$NAME/"
          tar -C dist -czf "dist/$NAME.tar.gz" "$NAME"
          rm -rf "dist/$NAME"

      - name: Paquete (macOS)
        if: runner.os == 'macOS'
        run: |
          NAME="esceQ-${{ steps.version.outputs.version }}-macos-universal"
          mkdir -p "dist/$NAME"
          cp -R "$ARTEFACTS/VST3/esceQ.vst3" "$ARTEFACTS/AU/esceQ.component" "$ARTEFACTS/CLAP/esceQ.clap" "dist/$NAME/"
          cp LICENSE "dist/$NAME/LICENSE.txt"
          cp ui/assets/fonts/OFL.txt "dist/$NAME/Inter-font-license.txt"
          cp packaging/unix/INSTALL.txt "dist/$NAME/"
          # ditto conserva los paquetes (bundles) y sus firmas ad hoc. Las
          # arquitecturas y la firma se comprobaron antes de validarlos.
          ditto -c -k --keepParent "dist/$NAME" "dist/$NAME.zip"
          rm -rf "dist/$NAME"

      - name: Instalador (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue)) {
            choco install innosetup --no-progress -y
            $env:PATH += ";${env:ProgramFiles(x86)}\Inno Setup 6"
          }
          $version = "${{ steps.version.outputs.version }}"
          $source = (Resolve-Path "$env:ARTEFACTS").Path
          $out = Join-Path (Get-Location) "dist"
          iscc "/DAppVersion=$version" "/DSourceDir=$source" "/DOutputDir=$out" packaging\windows\esceQ.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-ChildItem dist

      # El instalador se prueba de verdad: se instala en silencio, se comprueba
      # que deja cada formato en su carpeta y se valida el VST3 instalado.
      - name: Probar el instalador (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $setup = Get-ChildItem dist\esceQ-*-windows-x64-setup.exe | Select-Object -First 1
          $process = Start-Process -FilePath $setup.FullName -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART" -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "El instalador termino con codigo $($process.ExitCode)" }
          $vst3 = "$env:CommonProgramFiles\VST3\esceQ.vst3"
          $clap = "$env:CommonProgramFiles\CLAP\esceQ.clap"
          if (-not (Test-Path "$vst3\Contents\x86_64-win\esceQ.vst3")) { throw "Falta el VST3 en $vst3" }
          if (-not (Test-Path $clap)) { throw "Falta el CLAP en $clap" }
          # pluginval es una aplicacion de ventana: PowerShell no espera a que
          # termine si no se lanza con -Wait.
          $validation = Start-Process -FilePath "${{ matrix.pluginval_bin }}" -ArgumentList "--strictness-level", "5", "--validate", "`"$vst3`"" -Wait -PassThru -NoNewWindow
          if ($validation.ExitCode -ne 0) { throw "pluginval ha fallado con el VST3 instalado (codigo $($validation.ExitCode))" }
          # Y se desinstala limpio.
          $uninstaller = Get-ChildItem "$env:ProgramFiles\esceQ\unins*.exe" | Select-Object -First 1
          Start-Process -FilePath $uninstaller.FullName -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART" -Wait
          Start-Sleep -Seconds 3
          if (Test-Path $vst3) { throw "El desinstalador ha dejado $vst3" }
          if (Test-Path $clap) { throw "El desinstalador ha dejado $clap" }

      - name: Subir paquetes
        uses: actions/upload-artifact@v4
        with:
          name: esceQ-${{ runner.os }}
          path: dist/*
          if-no-files-found: error
